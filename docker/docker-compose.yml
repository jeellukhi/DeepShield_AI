version: "3.9"
services:
  mongodb:
    image: mongo:7
    container_name: deepshield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: deepshield-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: deepshield_ai
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
      AUTH_JWT_SECRET: CHANGE_ME_DEEPSHIELD_JWT_SECRET_32_CHARS_MIN
      AUTH_ADMIN_USERNAME: admin
      AUTH_ADMIN_PASSWORD: Admin@123
      AUTH_USER_USERNAME: user
      AUTH_USER_PASSWORD: User@123

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: deepshield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
